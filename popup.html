<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<nav>
  <button class="tab active" data-tab="json">JSON</button>
  <button class="tab" data-tab="b64">Base64</button>
  <button class="tab" data-tab="color">Color</button>
</nav>

<section id="json" class="panel active">
  <textarea id="jsonIn" placeholder="Paste JSON here..."></textarea>
  <div class="row">
    <button id="jsonFormat">Format</button>
    <button id="jsonMinify">Minify</button>
    <button id="jsonCopy" class="ghost">Copy</button>
  </div>
  <div id="jsonMsg" class="msg"></div>
</section>

<section id="b64" class="panel">
  <textarea id="b64In" placeholder="Text or Base64..."></textarea>
  <div class="row">
    <button id="b64Enc">Encode</button>
    <button id="b64Dec">Decode</button>
    <button id="b64Copy" class="ghost">Copy</button>
  </div>
  <textarea id="b64Out" readonly placeholder="Result"></textarea>
  <div id="b64Msg" class="msg"></div>
</section>

<section id="color" class="panel">
  <div class="row">
    <button id="pick">Pick from screen</button>
    <input type="color" id="colorInput" value="#4f46e5">
  </div>
  <div id="swatch"></div>
  <div class="vals">
    <div><span>HEX</span><code id="hex"></code><button class="copy ghost" data-src="hex">Copy</button></div>
    <div><span>RGB</span><code id="rgb"></code><button class="copy ghost" data-src="rgb">Copy</button></div>
    <div><span>HSL</span><code id="hsl"></code><button class="copy ghost" data-src="hsl">Copy</button></div>
  </div>
  <div id="colorMsg" class="msg"></div>
</section>
<script src="popup.js"></script>
</body>
</html>
